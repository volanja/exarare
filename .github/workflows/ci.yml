name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-test:
    name: lint and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  el:
    name: integration (${{ matrix.image }})
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image:
          - almalinux:8
          - almalinux:9
          - almalinux:10
          - redhat/ubi8
          - redhat/ubi9
          - redhat/ubi10
    steps:
      # Before checkout, which needs git in the container. zsh is installed so
      # the zsh hook is covered too; bash differs per release (4.4 on EL8,
      # 5.1 on EL9, 5.2 on EL10).
      - name: Install build and test dependencies
        run: |
          # The repodata baked into the image goes stale after a point release,
          # and dnf then asks every mirror for a checksum none of them has, so
          # the cache is cleared before anything is fetched. Mirrors can also be
          # briefly unreachable, hence the retries.
          for attempt in 1 2 3; do
            dnf clean all
            dnf install -y --setopt=install_weak_deps=False \
              git gcc zsh procps-ng && break
            echo "attempt $attempt failed"
            sleep 10
          done
          for tool in git gcc zsh ps; do
            command -v "$tool" >/dev/null || {
              echo "::error::$tool was not installed"
              exit 1
            }
          done
      - uses: actions/checkout@v5
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Show shell versions
        run: |
          bash --version | head -1
          zsh --version
      - name: Test
        env:
          EXARARE_EL_TESTS: '1'
        run: cargo test --locked
      - name: Check that the exarare command name is free in the distro
        run: |
          if dnf -q provides '*/bin/exarare' 2>/dev/null | grep -q .; then
            echo "::error::an RPM already provides a command named exarare"
            exit 1
          fi
          echo "no RPM provides a command named exarare"

  ansible-lint:
    name: ansible-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pipx install ansible-lint
      - name: Record a session and generate playbooks
        run: |
          set -euo pipefail
          export EXARARE_HOME="$RUNNER_TEMP/exarare"
          watch="$RUNNER_TEMP/etc"
          mkdir -p "$watch/nginx"
          printf 'listen 80\n' > "$watch/nginx/nginx.conf"
          printf 'old\n' > "$watch/legacy.conf"
          cargo build --locked
          bin="$PWD/target/debug/exarare"
          printf 'PATH=%s:$PATH\nexarare step Configure nginx\nprintf "listen 8080\\n" > %s/nginx/nginx.conf\nexarare note reload needed\nchmod 600 %s/nginx/nginx.conf\nrm %s/legacy.conf\nexit\n' \
            "$(dirname "$bin")" "$watch" "$watch" "$watch" \
            | "$bin" start --name "web01 nginx setup" --shell /bin/bash --watch "$watch"
          id=$("$bin" list | tail -1 | awk '{print $1}')
          "$bin" gen ansible "$id" -o playbook-en
          "$bin" gen ansible "$id" -o playbook-ja --lang ja
      - name: Lint the generated playbooks
        run: |
          ansible-lint playbook-en/playbook.yml
          ansible-lint playbook-ja/playbook.yml

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    permissions:
      # Comment on the pull request, and read and write the stored reports.
      pull-requests: write
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - name: Collect coverage
        run: cargo llvm-cov --locked --lcov --output-path lcov.info
      - uses: k1LoW/octocov-action@v1
