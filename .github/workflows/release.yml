name: Release

on:
  push:
    tags:
      - v[0-9]+.*
  # Builds and packages without publishing, so the release path can be tried
  # before the first tag is ever pushed.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The tag names the version that the artifacts will claim, so a mismatch with
  # Cargo.toml is caught before anything is published.
  check-version:
    name: check the tag against Cargo.toml
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compare versions
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          crate=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          echo "tag=$tag crate=$crate"
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the version in Cargo.toml ($crate)"
            exit 1
          fi

  create-release:
    needs: check-version
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/create-gh-release-action@v1
        with:
          title: exarare $version
          token: ${{ secrets.GITHUB_TOKEN }}

  # The Linux binaries are static musl builds, so one of them runs on EL 8, 9
  # and 10 whatever their glibc, and cross supplies the C toolchain that musl
  # needs for the target. The macOS binaries are for developing exarare rather
  # than for recording a server, and build natively on a macOS runner.
  binaries:
    needs: create-release
    if: startsWith(github.ref, 'refs/tags/')
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            build-tool: cross
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            build-tool: cross
          - target: aarch64-apple-darwin
            os: macos-latest
            build-tool: cargo
          - target: x86_64-apple-darwin
            os: macos-latest
            build-tool: cargo
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: exarare
          target: ${{ matrix.target }}
          build-tool: ${{ matrix.build-tool }}
          tar: unix
          zip: none
          checksum: sha256
          include: README.md,LICENSE-MIT,LICENSE-APACHE
          token: ${{ secrets.GITHUB_TOKEN }}

  rpm:
    needs: create-release
    if: startsWith(github.ref, 'refs/tags/')
    name: rpm (${{ matrix.arch }})
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: x86_64
          - target: aarch64-unknown-linux-musl
            arch: aarch64
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install the packaging tools
        run: |
          cargo install cross --locked
          cargo install cargo-generate-rpm --locked
      - name: Build
        run: cross build --release --locked --target ${{ matrix.target }}
      - name: Package
        id: package
        run: |
          set -euo pipefail
          cargo generate-rpm --target ${{ matrix.target }} --arch ${{ matrix.arch }}
          rpm=$(ls target/${{ matrix.target }}/generate-rpm/*.rpm)
          echo "path=$rpm" >> "$GITHUB_OUTPUT"
          # The checksum names the file alone, so that `sha256sum -c` works
          # where the release was downloaded rather than looking for a path
          # from this build tree.
          ( cd "$(dirname "$rpm")" && sha256sum "$(basename "$rpm")" \
            | tee "$(basename "$rpm").sha256" )
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "${{ steps.package.outputs.path }}" \
            "${{ steps.package.outputs.path }}.sha256" \
            --clobber

  # Run by hand to exercise the build and packaging without publishing
  # anything. The artifacts are kept for inspection instead of being uploaded
  # to a release.
  dry-run:
    if: github.event_name == 'workflow_dispatch'
    name: dry run (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            arch: x86_64
            rpm: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            arch: aarch64
            rpm: true
          - target: aarch64-apple-darwin
            os: macos-latest
            arch: arm64
            rpm: false
          - target: x86_64-apple-darwin
            os: macos-latest
            arch: x86_64
            rpm: false
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install the packaging tools
        if: matrix.rpm
        run: |
          cargo install cross --locked
          cargo install cargo-generate-rpm --locked
      - name: Build with cross
        if: matrix.rpm
        run: cross build --release --locked --target ${{ matrix.target }}
      - name: Build with cargo
        if: ${{ !matrix.rpm }}
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Check the binary
        run: |
          set -euo pipefail
          file "target/${{ matrix.target }}/release/exarare"
          # Only the musl builds are expected to be static. A macOS binary links
          # against libSystem, which cannot be avoided and is not a fault.
          case "${{ matrix.target }}" in
            *-linux-musl)
              if file "target/${{ matrix.target }}/release/exarare" | grep -q "dynamically linked"; then
                echo "::error::the binary is not statically linked"
                exit 1
              fi
              ;;
          esac
      - name: Package
        if: matrix.rpm
        run: cargo generate-rpm --target ${{ matrix.target }} --arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          # Named by target, not arch: x86_64 appears twice, once for musl and
          # once for macOS, and two artifacts cannot share a name.
          name: exarare-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/exarare
            target/${{ matrix.target }}/generate-rpm/*.rpm
          # The RPM pattern matches nothing on macOS, which is expected.
          if-no-files-found: warn
