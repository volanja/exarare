# Coverage reporting, see https://github.com/k1LoW/octocov
coverage:
  paths:
    - lcov.info
  # Line coverage was 82% when this was added and is around 90% now. The bar is
  # deliberately lower: it should catch a large drop, not block work on a few
  # lines.
  acceptable: 70%

# codeToTestRatio is deliberately not configured. Most of this project's tests
# live in `#[cfg(test)] mod tests` inside src/**, so counting only tests/** made
# the ratio fall as tests were added, and counting src/** on both sides would
# compare the same lines with themselves. Coverage answers the same question.

comment:
  if: is_pull_request

summary:
  if: true

# Keep reports so that a pull request can be compared with the default branch.
report:
  if: is_default_branch
  datastores:
    - artifact://${GITHUB_REPOSITORY}

diff:
  datastores:
    - artifact://${GITHUB_REPOSITORY}
