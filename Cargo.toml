[package]
name = "exarare"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Record server build work and turn it into a Markdown runbook and an Ansible playbook"
license = "MIT OR Apache-2.0"
repository = "https://github.com/volanja/exarare"

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
clap = { version = "4.6.6", features = ["derive"] }
globset = "0.4.19"
nix = { version = "0.31.3", features = ["signal", "process", "hostname"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
similar = "3.2.0"
time = { version = "0.3.55", features = ["formatting", "serde-well-known", "macros"] }
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"
