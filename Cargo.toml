[package]
name = "exarare"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Record server build work and turn it into a Markdown runbook and an Ansible playbook"
license = "MIT OR Apache-2.0"
repository = "https://github.com/volanja/exarare"

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
clap = { version = "4.6.6", features = ["derive"] }
globset = "0.4.19"
nix = { version = "0.31.3", features = ["signal", "process", "hostname"] }
notify = "8.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
similar = "3.2.0"
time = { version = "0.3.55", features = ["formatting", "serde-well-known", "macros"] }
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"

# The RPM carries a statically linked binary, so it has no library
# dependencies to discover and the same package installs on EL 8, 9 and 10.
[package.metadata.generate-rpm]
auto-req = "disabled"
assets = [
    { source = "target/release/exarare", dest = "/usr/bin/exarare", mode = "755" },
    { source = "README.md", dest = "/usr/share/doc/exarare/README.md", mode = "644", doc = true },
    { source = "LICENSE-MIT", dest = "/usr/share/licenses/exarare/LICENSE-MIT", mode = "644" },
    { source = "LICENSE-APACHE", dest = "/usr/share/licenses/exarare/LICENSE-APACHE", mode = "644" },
]
